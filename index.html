<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen-Z-Store</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🛍️ Gen-Z-Store</h1>
  <input id="search" placeholder="Search products...">
  <span id="userBox"></span>
  <button id="cartBtn">🛒 Cart (<span id="count">0</span>)</button>
</header>
<main>
  <aside>
    <h3>Filters</h3>
    <label>Category</label>
    <select id="category"><option>All</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Cosmetics</option><option>Stationery</option></select>
    <label>Sort by</label>
    <select id="sort"><option value="">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option></select>
    <label>Max price: ₹<span id="maxLabel">5000</span></label>
    <input type="range" id="max" min="500" max="5000" step="100" value="5000">
    <div id="adminBox" class="hidden">
      <h3>Add Product (admin)</h3>
      <form id="addForm">
        <input name="name" placeholder="Name" required>
        <input name="price" type="number" placeholder="Price (₹)" required>
        <select name="category"><option>Electronics</option><option>Fashion</option><option>Home</option><option>Cosmetics</option><option>Stationery</option></select>
        <input name="emoji" placeholder="Emoji (e.g. 📚)" maxlength="2">
        <input name="desc" placeholder="Description">
        <input name="colour" placeholder="Colour">
        <button>Add</button>
      </form>
    </div>
  </aside>
  <section id="grid"></section>
</main>

<div id="drawer" class="hidden">
  <h2>Your Cart <button id="close">✕</button></h2>
  <div id="items"></div>
  <p class="total">Total: <b id="total">₹0</b></p>
  <button id="checkout">Checkout</button>
</div>

<div id="authModal" class="modal hidden">
  <form id="authForm" class="box">
    <h2 id="authTitle">Login</h2>
    <input class="su" id="f_name" name="name" placeholder="Full name">
    <input id="f_email" name="email" type="email" placeholder="Email" required>
    <input class="su" name="phone" placeholder="Phone number">
    <input class="su" name="address" placeholder="Address">
    <input id="f_pw" name="password" type="password" placeholder="Password (min 6 characters)" required>
    <p id="authErr" class="err"></p>
    <button id="authSubmit">Login</button>
    <button type="button" id="authSwitch" class="link"></button>
    <button type="button" id="authClose" class="link">Cancel</button>
  </form>
</div>

<div id="ordersModal" class="modal hidden">
  <div class="box">
    <h2>Orders</h2>
    <div id="ordersList"></div>
    <button id="ordersClose">Close</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
